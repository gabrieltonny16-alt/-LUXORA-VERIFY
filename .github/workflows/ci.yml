name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install core dependencies
        run: npm install
      - name: Type-check core
        run: npm run typecheck
      - name: Test core
        run: npm test

  luxora-mail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mail
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install LUXORA MAIL dependencies
        run: npm install
      - name: Type-check LUXORA MAIL
        run: npm run typecheck
      - name: Test LUXORA MAIL queue, DSN and local SMTP integration
        run: npm test
      - name: Build LUXORA MAIL
        run: npm run build
