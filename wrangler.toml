name = "luxora-verify"
main = "src/index.ts"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "luxora-verify"
database_id = "REPLACE_WITH_CREATED_D1_DATABASE_ID"
migrations_dir = "migrations"

[[services]]
binding = "MAIL_SERVICE"
service = "luxora-mail-gateway"
